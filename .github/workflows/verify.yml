name: Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Production build
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser proof
        run: bun run test:e2e
