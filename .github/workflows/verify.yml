name: Verify

on:
  push:
    branches: [main, fix/playwright-node-server-e2e]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.EXACT_MATCH_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXACT_MATCH_SUPABASE_PUBLISHABLE_KEY }}
      E2E_REVIEWER_EMAIL: ${{ secrets.EXACT_MATCH_E2E_REVIEWER_EMAIL }}
      E2E_REVIEWER_PASSWORD: ${{ secrets.EXACT_MATCH_E2E_REVIEWER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser proof
        run: bun run test:e2e
